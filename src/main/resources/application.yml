server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: kabadiwala-backend

  datasource:
    url: ${SUPABASE_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}}
    username: ${SUPABASE_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${SUPABASE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_AUTH_ISSUER:${SUPABASE_URL:https://dummy.supabase.co}/auth/v1}
          jwk-set-uri: ${SUPABASE_AUTH_JWK_SET_URI:${SUPABASE_URL:https://dummy.supabase.co}/auth/v1/.well-known/jwks.json}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

# Custom application configuration
kabadiwala:
  ml:
    service-url: ${ML_SERVICE_URL:http://localhost:8000}
    predict-endpoint: /api/v1/predict
    connect-timeout-ms: 3000
    read-timeout-ms: 8000
    enabled: ${ML_SERVICE_ENABLED:true}

  storage:
    supabase:
      url: ${SUPABASE_URL:https://dummy.supabase.co}
      service-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      bucket: ${SUPABASE_STORAGE_BUCKET:ewaste-images}
    local-fallback-dir: ${LOCAL_STORAGE_DIR:./storage/uploads}
    use-local-fallback: ${USE_LOCAL_STORAGE:true}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
