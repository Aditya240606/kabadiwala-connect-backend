server:
  port: 0

spring:
  application:
    name: kabadiwala-backend-test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/dummy-jwks

kabadiwala:
  ml:
    service-url: http://localhost:8000
    predict-endpoint: /api/v1/predict
    connect-timeout-ms: 1000
    read-timeout-ms: 1000
    enabled: true

  storage:
    use-local-fallback: true
    local-fallback-dir: ./target/test-storage
